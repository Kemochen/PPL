name: Native Swift IPA for AltStore
on:
  push:
    branches: [codex/swift-native]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
      - 'test_ipa.py'
      - '*.py'
      - 'static/**'
      - 'templates/**'
      - 'requirements.txt'
      - 'test_offline.cjs'
      - 'test_mobile.cjs'
      - 'package*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt -r ios/offline-requirements.txt
      - run: python -m unittest discover -p 'test_*.py' -v
      - run: node --test test_mobile.cjs
  ios:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r ios/offline-requirements.txt
      - name: Install project generator
        run: brew install xcodegen
      - name: Build device IPA for AltStore re-signing
        run: bash ios/build.sh altstore
      - name: Select available iPhone simulator
        run: python ios/select_simulator.py
      - name: Test native Swift parity and iPhone interface
        run: >-
          xcodebuild -project ios/PPL.xcodeproj -scheme PPL
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -derivedDataPath ios/build/Simulator
          -resultBundlePath ios/build/NativeTests.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Export native UI screenshots
        if: ${{ always() }}
        run: |
          if [ -d ios/build/NativeTests.xcresult ]; then
            xcrun xcresulttool export attachments --path ios/build/NativeTests.xcresult --output-path ios/build/screenshots
          fi
      - name: Native test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: PPL-native-test-results
          path: |
            ios/build/NativeTests.xcresult
            ios/build/screenshots
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: PPL-AltStore
          path: |
            ios/build/PPL-AltStore.ipa
            ios/build/PPL-AltStore.ipa.sha256
            ios/build/package-info.json
            ios/build/INSTALL.txt
          if-no-files-found: error
          retention-days: 30
      - name: Installation summary
        run: |
          echo '## PPL for AltStore Classic' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the PPL-AltStore artifact, extract the ZIP and import PPL-AltStore.ipa into AltStore Classic. No Apple signing secrets are used by this workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Native SwiftUI + Swift calculations, iOS 26+. No Python, WebView or server in the IPA. Import a JSON backup to transfer profiles from the previous WebView app.' >> "$GITHUB_STEP_SUMMARY"
